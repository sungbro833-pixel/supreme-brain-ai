<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPREME BRAIN AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d1b;color:white;font-family:Arial,sans-serif}
header{padding:22px;text-align:center;border-bottom:1px solid #26334d}
h1{color:#9b8cff;margin:0}
main{max-width:750px;margin:35px auto;padding:20px}
.welcome{text-align:center;margin:50px 0}
.welcome h2{font-size:30px}
.welcome p{color:#aab5cc}
.chat{min-height:180px;padding:15px;background:#111a2d;border-radius:15px;margin-bottom:15px}
textarea{width:100%;height:100px;padding:15px;background:#111a2d;color:white;border:1px solid #465477;border-radius:12px;font-size:16px}
button{width:100%;padding:15px;margin-top:12px;background:#7865ed;color:white;border:0;border-radius:12px;font-size:17px;font-weight:bold}
.note{color:#98a4bb;text-align:center;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<header><h1>🧠 SUPREME BRAIN AI</h1><p>Your Own AI Platform</p></header>
<main>
<div class="welcome"><h2>Welcome to Supreme Brain AI</h2><p>Your ideas. Your intelligence. Your AI.</p></div>
<div class="chat" id="chat">Hello! I am Supreme Brain AI. My AI engine will be connected soon.</div>
<textarea id="prompt" placeholder="Ask anything..."></textarea>
<button onclick="sendMessage()">Send Message</button>
<p class="note">Supreme Brain AI • Version 1.0</p>
</main>
<script>
function sendMessage(){
const box=document.getElementById('prompt');
const chat=document.getElementById('chat');
if(!box.value.trim())return;
chat.innerHTML='<b>You:</b> '+box.value.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'<br><br><b>Supreme Brain AI:</b> AI engine is not connected yet.';
box.value='';
}
</script>
</body>
</html>
